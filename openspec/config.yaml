schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform
context: |
  Tech stack: Python, FastAPI, LangGraph, Gemini Flash (dietro LLMClient swappabile, fallback deterministico), PostgreSQL (SQLAlchemy + Alembic), WhatsApp via provider swappabile (Meta Cloud API o Twilio, uno attivo alla volta), Google Calendar API, Docker Compose + Caddy.
  Domain: chatbot WhatsApp per qualificazione lead immobiliari (agente virtuale "FluxAssist"). Macchina a stati rigida: intento, zona, tipologia, budget, stato mutuo.
  Deployment: VPS (preferito a cloud gestito, traffico < 100 conversazioni/giorno).
  Team: sviluppatore singolo, nessun vincolo di linguaggio.
  Conventions: conventional commits, commenti e documentazione in italiano.

